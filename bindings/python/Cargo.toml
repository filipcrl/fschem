[package]
name = "fschem-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT AND GPL-2.0-or-later"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
fschem = { path = "../..", default-features = false }
pyo3 = { version = "0.27", features = ["extension-module"] }
